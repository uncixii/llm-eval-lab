[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-lab"
version = "0.1.0"
description = "结构化 LLM evaluation 与回归门禁 reference implementation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
providers = ["litellm>=1.40"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
eval-demo = "llm_eval_lab.examples:main"
